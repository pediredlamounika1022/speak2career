```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak2Career - Technical Questions</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      color: #202840;
    }

    header {
      background: #263b67;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000012;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .subject-btn {
      background: #e7edff;
      color: #263b67;
      font-weight: bold;
      border: 1px solid #d1dcff;
    }

    .subject-btn:hover {
      background: #d4dfff;
    }

    .main-btn {
      background: #263b67;
      color: white;
      margin-top: 15px;
    }

    .main-btn:hover {
      background: #192b50;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      background: #f5f6fa;
      border: 1px solid #dce1ec;
      margin: 10px 0;
    }

    .option:hover:not(:disabled) {
      background: #e7edff;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    .correct {
      background: #d9f7df !important;
      border-color: #369b50;
    }

    .wrong {
      background: #ffe0e0 !important;
      border-color: #d94b4b;
    }

    #quizSection,
    #resultSection {
      display: none;
    }

    #feedback {
      margin-top: 15px;
      font-weight: bold;
    }

    #explanation {
      color: #536078;
      line-height: 1.6;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
      color: #536078;
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .panel {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Speak2Career</h1>
  <p>Technical Interview Practice</p>
</header>

<main class="container">

  <section class="panel" id="subjectSection">
    <h2>Choose a Subject</h2>
    <p>Select a subject to practice technical interview questions.</p>

    <div class="subjects">
      <button class="subject-btn" onclick="startQuiz('C Programming')">C Programming</button>
      <button class="subject-btn" onclick="startQuiz('Java')">Java</button>
      <button class="subject-btn" onclick="startQuiz('Python')">Python</button>
      <button class="subject-btn" onclick="startQuiz('SQL')">SQL</button>
      <button class="subject-btn" onclick="startQuiz('DBMS')">DBMS</button>
      <button class="subject-btn" onclick="startQuiz('Operating Systems')">Operating Systems</button>
      <button class="subject-btn" onclick="startQuiz('Computer Networks')">Computer Networks</button>
      <button class="subject-btn" onclick="startQuiz('Data Structures')">Data Structures</button>
      <button class="subject-btn" onclick="startQuiz('HTML & CSS')">HTML & CSS</button>
    </div>

    <button class="main-btn" onclick="goDashboard()">Back to Dashboard</button>
  </section>

  <section class="panel" id="quizSection">
    <div class="top-row">
      <span id="subjectName"></span>
      <span id="progress"></span>
      <span id="liveScore">Score: 0</span>
    </div>

    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback" aria-live="polite"></p>
    <p id="explanation"></p>

    <button class="main-btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
    <button class="main-btn" onclick="backToSubjects()">Choose Another Subject</button>
  </section>

  <section class="panel" id="resultSection">
    <h2>Practice Completed!</h2>
    <p id="resultSubject"></p>
    <h2 id="finalScore"></h2>
    <p id="resultMessage"></p>

    <button class="main-btn" onclick="backToSubjects()">Practice Another Subject</button>
    <button class="main-btn" onclick="goDashboard()">Back to Dashboard</button>
  </section>

</main>

<script>
const questionBank = {
  "C Programming": [
    {
      q: "Which symbol ends a statement in C?",
      options: [";", ":", ".", ","],
      answer: 0,
      explanation: "A semicolon (;) marks the end of a statement in C."
    },
    {
      q: "Which function is the usual starting point of a C program?",
      options: ["start()", "main()", "run()", "begin()"],
      answer: 1,
      explanation: "Program execution normally begins in the main() function."
    },
    {
      q: "Which format specifier is commonly used to print an int with printf?",
      options: ["%c", "%s", "%d", "%f"],
      answer: 2,
      explanation: "%d is commonly used to display an integer."
    }
  ],

  "Java": [
    {
      q: "Which keyword is used to create a class in Java?",
      options: ["define", "class", "create", "struct"],
      answer: 1,
      explanation: "The class keyword declares a class in Java."
    },
    {
      q: "Which method is the standard entry point of a Java application?",
      options: ["main()", "start()", "runApp()", "execute()"],
      answer: 0,
      explanation: "A standard Java application starts from the main method with its required signature."
    },
    {
      q: "Which keyword creates an object in Java?",
      options: ["this", "class", "new", "void"],
      answer: 2,
      explanation: "The new keyword creates an object."
    }
  ],

  "Python": [
    {
      q: "Which function displays output in Python?",
      options: ["show()", "echo()", "print()", "displayText()"],
      answer: 2,
      explanation: "The print() function displays output."
    },
    {
      q: "Which symbol starts a single-line comment in Python?",
      options: ["//", "#", "<!--", "/*"],
      answer: 1,
      explanation: "Python uses # for a single-line comment."
    },
    {
      q: "Which data type stores True or False?",
      options: ["str", "int", "list", "bool"],
      answer: 3,
      explanation: "The bool type represents True or False values."
    }
  ],

  "SQL": [
    {
      q: "Which SQL command retrieves data from a table?",
      options: ["GET", "SELECT", "OPEN", "FETCH ALL"],
      answer: 1,
      explanation: "SELECT retrieves data from database tables."
    },
    {
      q: "Which clause filters rows using a condition?",
      options: ["WHERE", "ORDER BY", "GROUP BY", "FROM"],
      answer: 0,
      explanation: "WHERE filters rows according to a condition."
    },
    {
      q: "Which command adds new rows to a table?",
      options: ["UPDATE", "ALTER", "INSERT INTO", "CREATE"],
      answer: 2,
      explanation: "INSERT INTO adds new records to a table."
    }
  ],

  "DBMS": [
    {
      q: "What does DBMS stand for?",
      options: [
        "Data Backup Management System",
        "Database Management System",
        "Digital Base Machine System",
        "Data Building Management Service"
      ],
      answer: 1,
      explanation: "DBMS stands for Database Management System."
    },
    {
      q: "Which key uniquely identifies each row in a table?",
      options: ["Foreign key", "Duplicate key", "Primary key", "Secondary value"],
      answer: 2,
      explanation: "A primary key uniquely identifies each row."
    },
    {
      q: "What is the main purpose of a foreign key?",
      options: [
        "To connect related tables",
        "To format text",
        "To delete every row",
        "To sort all records automatically"
      ],
      answer: 0,
      explanation: "A foreign key establishes a relationship with a key in another or the same table."
    }
  ],

  "Operating Systems": [
    {
      q: "Which of these is an operating system?",
      options: ["HTML", "Windows", "SQL", "Java"],
      answer: 1,
      explanation: "Windows is an operating system."
    },
    {
      q: "Which component manages a computer's processes and resources?",
      options: ["Browser", "Compiler", "Kernel", "Text editor"],
      answer: 2,
      explanation: "The kernel manages core system resources and processes."
    },
    {
      q: "What is multitasking?",
      options: [
        "Running or managing multiple tasks over the same period",
        "Deleting multiple files only",
        "Installing one program",
        "Turning off the computer"
      ],
      answer: 0,
      explanation: "Multitasking lets an operating system manage multiple tasks during the same period."
    }
  ],

  "Computer Networks": [
    {
      q: "What does LAN stand for?",
      options: [
        "Large Access Network",
        "Local Area Network",
        "Linked Application Node",
        "Long Area Number"
      ],
      answer: 1,
      explanation: "LAN stands for Local Area Network."
    },
    {
      q: "Which protocol is commonly used to access secure websites?",
      options: ["FTP", "HTTP only", "HTTPS", "SMTP"],
      answer: 2,
      explanation: "HTTPS secures web communication using TLS."
    },
    {
      q: "What does an IP address help identify?",
      options: [
        "A device or network interface on an IP network",
        "A computer's keyboard layout",
        "A file's font",
        "A monitor's brightness"
      ],
      answer: 0,
      explanation: "An IP address identifies a network interface for communication on an IP network."
    }
  ],

  "Data Structures": [
    {
      q: "Which data structure follows LIFO?",
      options: ["Queue", "Stack", "Tree", "Graph"],
      answer: 1,
      explanation: "A stack follows Last In, First Out (LIFO)."
    },
    {
      q: "Which data structure normally follows FIFO?",
      options: ["Stack", "Tree", "Queue", "Heap"],
      answer: 2,
      explanation: "A queue follows First In, First Out (FIFO)."
    },
    {
      q: "Which structure stores elements in linked nodes?",
      options: ["Linked list", "Integer", "Boolean", "Character"],
      answer: 0,
      explanation: "A linked list stores elements in nodes connected by links."
    }
  ],

  "HTML & CSS": [
    {
      q: "What is the main purpose of HTML?",
      options: [
        "Manage databases",
        "Structure web page content",
        "Create an operating system",
        "Send emails automatically"
      ],
      answer: 1,
      explanation: "HTML defines the structure and content of web pages."
    },
    {
      q: "What is CSS mainly used for?",
      options: [
        "Writing database queries",
        "Managing computer memory",
        "Styling web pages",
        "Compiling Java programs"
      ],
      answer: 2,
      explanation: "CSS controls the appearance and layout of web pages."
    },
    {
      q: "Which HTML tag creates a hyperlink?",
      options: ["<a>", "<p>", "<h1>", "<table>"],
      answer: 0,
      explanation: "The <a> tag creates a hyperlink."
    }
  ]
};

let currentSubject = "";
let currentIndex = 0;
let score = 0;
let answered = false;

function startQuiz(subject) {
  currentSubject = subject;
  currentIndex = 0;
  score = 0;
  answered = false;

  document.getElementById("subjectSection").style.display = "none";
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("quizSection").style.display = "block";

  showQuestion();
}

function showQuestion() {
  const item = questionBank[currentSubject][currentIndex];

  answered = false;
  document.getElementById("subjectName").textContent = currentSubject;
  document.getElementById("progress").textContent =
    "Question " + (currentIndex + 1) + " of " + questionBank[currentSubject].length;
  document.getElementById("liveScore").textContent = "Score: " + score;
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("explanation").textContent = "";
  document.getElementById("nextBtn").disabled = true;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  item.options.forEach(function(option, index) {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = String.fromCharCode(65 + index) + ". " + option;
    button.onclick = function() {
      chooseAnswer(index);
    };
    optionsDiv.appendChild(button);
  });
}

function chooseAnswer(selected) {
  if (answered) return;

  answered = true;
  const item = questionBank[currentSubject][currentIndex];
  const buttons = document.querySelectorAll("#options .option");

  buttons.forEach(function(button, index) {
    button.disabled = true;

    if (index === item.answer) {
      button.classList.add("correct");
    }

    if (index === selected && selected !== item.answer) {
      button.classList.add("wrong");
    }
  });

  if (selected === item.answer) {
    score++;
    document.getElementById("feedback").textContent = "Correct! Well done.";
  } else {
    document.getElementById("feedback").textContent =
      "Not quite. The correct answer is " + item.options[item.answer] + ".";
  }

  document.getElementById("explanation").textContent = item.explanation;
  document.getElementById("liveScore").textContent = "Score: " + score;
  document.getElementById("nextBtn").disabled = false;

  document.getElementById("nextBtn").textContent =
    currentIndex === questionBank[currentSubject].length - 1
      ? "View Result"
      : "Next Question";
}

function nextQuestion() {
  if (!answered) return;

  if (currentIndex < questionBank[currentSubject].length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quizSection").style.display = "none";
  document.getElementById("resultSection").style.display = "block";

  const total = questionBank[currentSubject].length;
  const percentage = Math.round((score / total) * 100);

  document.getElementById("resultSubject").textContent =
    "Subject: " + currentSubject;
  document.getElementById("finalScore").textContent =
    score + " / " + total + " (" + percentage + "%)";

  document.getElementById("resultMessage").textContent =
    percentage >= 80
      ? "Excellent work! Keep practising."
      : percentage >= 50
      ? "Good attempt! Review the explanations and try again."
      : "Keep learning. Review the basics and practise again.";

  try {
    const key = "speak2career_technical_history";
    const history = JSON.parse(localStorage.getItem(key) || "{}");
    history[currentSubject] = {
      score: score,
      total: total,
      percentage: percentage,
      date: new Date().toISOString()
    };
    localStorage.setItem(key, JSON.stringify(history));

    localStorage.setItem(
      "speak2career_technical_" + currentSubject,
      JSON.stringify(history[currentSubject])
    );
  } catch (error) {
    console.log("Score could not be saved in this browser.", error);
  }
}

function backToSubjects() {
  document.getElementById("quizSection").style.display = "none";
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("subjectSection").style.display = "block";
}

function goDashboard() {
  window.location.href = "./dashboard.html";
}
</script>

</body>
</html>
